[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falcon-policy-scoring"
version = "1.8.9"
description = "CrowdStrike Falcon policy analysis and grading tool"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.8"
authors = [{ name = "CrowdStrike Community" }]
maintainers = [
    { name = "Scott MacGregor", email = "scott.macgregor@crowdstrike.com" },
]
dependencies = [
    "crowdstrike-falconpy>=1.6.3",
    "tinydb>=4.8.0",
    "schedule>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "python-dotenv>=1.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["packaging>=25.0", "rich>=14.2.0"]
dynamodb = ["boto3>=1.34.0"]
test = [
    "pytest>=9.0.2; python_version >= '3.10'",
    "pytest>=8.0.0; python_version < '3.10'",
    "pytest-cov>=7.0.0; python_version >= '3.10'",
    "pytest-cov>=5.0.0; python_version < '3.10'",
    "pytest-vcr>=1.0.2",
    "freezegun>=1.5.5",
    "vcrpy>=8.1.1; python_version >= '3.10'",
    "vcrpy>=6.0.0; python_version < '3.10'",
    "jsonschema>=4.20.0",
    "boto3>=1.34.0",
    "moto[dynamodb]>=5.0.0; python_version >= '3.10'",
    "moto[dynamodb]>=4.2.0; python_version < '3.10'",
]
docs = ["sphinx>=8.2.3", "sphinx-autodoc-typehints>=3.2.0"]
man = ["argparse-manpage>=4.5"]
# Bundled into airgap tarballs; ruamel.yaml powers upgrade.sh's comment-preserving
# config merge (merge_config.py) and is a hard requirement of the upgrade flow.
airgap = ["ruamel.yaml>=0.18"]

[project.scripts]
policy-audit = "falcon_policy_scoring.__main__:main"

[project.urls]
homepage = "https://github.com/cs-shadowbq/falcon-policy-scoring"
repository = "https://github.com/cs-shadowbq/falcon-policy-scoring"
Tracker = "https://github.com/cs-shadowbq/falcon-policy-scoring/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
